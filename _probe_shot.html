<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="_probe_shot.js"></script><title>智慧运营 · 供应链数据驾驶舱与经营分析看板</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/cockpit.css">
  <link rel="stylesheet" href="css/screen.css">
</head>
<body>

  <!-- ============ 平台顶部导航 ============
       模块名与顺序对齐产品实际界面：首页 / 智选资源 / 智慧采购 / 智能物管 / 智慧运营
       （PRD 正文写的「智能采购 / 全景质控 / 数字物流」与产品不一致，以产品界面为准） -->
  <header class="layout-topbar">
    <div class="layout-topbar__brand">
      <span class="layout-topbar__logo" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 24.5V9.5l5-3 5 3v15"/><path d="M14.5 24.5V12.5l5-3 5 3v12"/><path d="M2 24.5h24"/><path d="M7 12h1.4M7 15h1.4M7 18h1.4M17 15h1.4M17 18h1.4"/>
        </svg>
      </span>
      <span class="layout-topbar__cname">中建八局<em>CHINA EIGHTH CONSTRUCTION</em></span>
      <span class="layout-topbar__sep" aria-hidden="true"></span>
      <span class="layout-topbar__app">数字供应链</span>
    </div>
    <nav class="layout-topbar__module-nav">
      <div class="layout-topbar__module-item layout-topbar__module-item--disabled" title="其他业务域，不在本原型范围内"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.2 8 2.8l5.5 4.4V13a.6.6 0 0 1-.6.6H9.4V9.6H6.6v4H3.1a.6.6 0 0 1-.6-.6z"/></svg><span>首页</span></div>
      <div class="layout-topbar__module-item layout-topbar__module-item--disabled" title="其他业务域，不在本原型范围内"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 2.6h1.8l1.5 7.5h6.6l1.4-5.2H4.2"/><circle cx="5.6" cy="12.6" r="1.1"/><circle cx="10.9" cy="12.6" r="1.1"/></svg><span>智选资源</span></div>
      <div class="layout-topbar__module-item layout-topbar__module-item--disabled" title="其他业务域，不在本原型范围内"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.9 13.6 5v6L8 14.1 2.4 11V5z"/><path d="M2.4 5 8 8.1 13.6 5M8 8.1V14"/><path d="M10.8 3.4v2.6M9.5 4.7h2.6"/></svg><span>智慧采购</span></div>
      <div class="layout-topbar__module-item layout-topbar__module-item--disabled" title="其他业务域，不在本原型范围内"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.9 13.6 5v6L8 14.1 2.4 11V5z"/><path d="M2.4 5 8 8.1 13.6 5M8 8.1V14"/></svg><span>智能物管</span></div>
      <div class="layout-topbar__module-item layout-topbar__module-item--active" title="当前模块"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 5.2h10.8v8.2H2.6z"/><path d="M5.4 5.2V3.6a2.6 2.6 0 0 1 5.2 0v1.6"/><path d="M2.6 8.4h10.8"/></svg><span>智慧运营</span></div>
      <div class="layout-topbar__module-item layout-topbar__module-item--disabled" title="其他业务域，不在本原型范围内"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.9l1.9 3.9 4.3.6-3.1 3 .8 4.3L8 11.6l-3.9 2.1.8-4.3-3.1-3 4.3-.6z"/></svg><span>八局甄选</span></div>
      <div class="layout-topbar__module-item layout-topbar__module-item--disabled" title="其他业务域，不在本原型范围内"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.9a2.1 2.1 0 1 0 0 4.2 2.1 2.1 0 0 0 0-4.2z"/><path d="M12.9 9.6a1.1 1.1 0 0 0 .22 1.21l.04.04a1.33 1.33 0 1 1-1.88 1.88l-.04-.04a1.1 1.1 0 0 0-1.21-.22 1.1 1.1 0 0 0-.67 1v.11a1.33 1.33 0 1 1-2.66 0v-.06a1.1 1.1 0 0 0-.72-1 1.1 1.1 0 0 0-1.21.22l-.04.04a1.33 1.33 0 1 1-1.88-1.88l.04-.04a1.1 1.1 0 0 0 .22-1.21 1.1 1.1 0 0 0-1-.67h-.11a1.33 1.33 0 1 1 0-2.66h.06a1.1 1.1 0 0 0 1-.72 1.1 1.1 0 0 0-.22-1.21l-.04-.04A1.33 1.33 0 1 1 5.55 2.3l.04.04a1.1 1.1 0 0 0 1.21.22h.05a1.1 1.1 0 0 0 .67-1v-.11a1.33 1.33 0 1 1 2.66 0v.06a1.1 1.1 0 0 0 .67 1 1.1 1.1 0 0 0 1.21-.22l.04-.04a1.33 1.33 0 1 1 1.88 1.88l-.04.04a1.1 1.1 0 0 0-.22 1.21v.05a1.1 1.1 0 0 0 1 .67h.11a1.33 1.33 0 1 1 0 2.66h-.06a1.1 1.1 0 0 0-1 .67z"/></svg><span>系统管理</span></div>
    </nav>
    <div class="layout-topbar__tools">
      <!-- 全局菜单搜索（与原型一致）：输入即过滤左侧菜单，回车跳第一个命中 -->
      <div class="layout-topbar__search">
        <input type="text" id="menuSearch" placeholder="搜索" aria-label="搜索菜单" autocomplete="off"/>
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.4"/><path d="M10.3 10.3 14 14"/></svg>
      </div>
      <!-- 组织视角（原型演示用：真实系统无此入口，权限由功能项授权 + 组织权限控制；R1/R2/R3） -->
      <div class="layout-org-switch" id="orgSwitch"
           title="原型演示：切换后可观察 R1 组织树收窄、R2 超权限明细不可见、R3 排名数值打码三条权限规则的实际效果">
        <span>组织视角</span><span class="layout-org-switch__badge">演示</span>
        <span id="orgCurrent">局总部</span>
        <div class="layout-org-switch__menu" id="orgMenu"></div>
      </div>
      <!-- 大屏模式（对外展示）：隐藏侧栏与面包屑，内容铺满；再次点击或 Esc 退出 -->
      <div class="layout-topbar__icon-btn" id="screenMode" title="大屏模式：隐藏侧栏与面包屑（再次点击或按 Esc 退出）">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 6V2.8h3.2M14 6V2.8h-3.2M2 10v3.2h3.2M14 10v3.2h-3.2"/>
        </svg>
      </div>
      <div class="layout-topbar__icon-btn" title="站内消息">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 1.8a4 4 0 0 0-4 4v2.5l-1.5 2.5H13.5L12 8.3V5.8a4 4 0 0 0-4-4z"/><path d="M5.5 13a2.5 2.5 0 0 0 5 0"/>
        </svg>
      </div>
      <div class="layout-topbar__user"><span class="layout-topbar__avatar"></span><span id="userName">李彬 · 局供应链管理部</span></div>
    </div>
  </header>

  <!-- ============ 智慧运营模块导航（F1–F8） ============ -->
  <aside class="layout-sidebar" id="sidebar">
    <ul class="layout-sidebar__menu" id="sidebarMenu"></ul>
  </aside>

  <!-- ============ 主内容区 ============ -->
  <main class="layout-main" id="layoutMain">
    <div class="layout-breadcrumb" id="breadcrumb">首页 &gt; 智慧运营</div>
    <div class="layout-content" id="pageContainer"></div>
  </main>

  <!-- 回到顶部（长页面：分供商管理看板等超过 4 屏） -->
  <div class="layout-backtop" id="backTop" title="回到顶部" hidden>
    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
  </div>

  <!-- ============ 模态框 ============ -->
  <div class="dsc-modal-overlay" id="modalOverlay">
    <div class="dsc-modal">
      <div class="dsc-modal__header"><span id="modalTitle">标题</span><span class="dsc-modal__close" id="modalClose">✕</span></div>
      <div class="dsc-modal__body" id="modalBody"></div>
      <div class="dsc-modal__footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/china-map.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/metric-cols.js"></script>
  <script src="js/view-screen.js"></script>
  <script src="js/view-cockpit.js"></script>
  <script src="js/view-project.js"></script>
  <script src="js/view-report.js"></script>
  <script src="js/view-compliance.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
